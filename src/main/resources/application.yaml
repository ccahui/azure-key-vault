logging:
  level:
    root: ERROR
    com.azure: DEBUG
    com.example.integration: INFO
spring:
  application:
    name: integration
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: ${AZURE_KEY_VAULT_URI}
local:
  timeout: 3000
azure:
  keyvault:
    uri: ${AZURE_KEY_VAULT_URI}
  identity:
    client-id: ${AZURE_CLIENT_ID}
    client-secret: ${AZURE_CLIENT_SECRET}
    tenant-id: ${AZURE_TENANT_ID}
api-key-2: af